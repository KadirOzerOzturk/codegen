name: Code generator - cli tool
on:
  push:
    branches-ignore:
      - 'releases/*'
  workflow_dispatch:
  repository_dispatch:
    types: [sync]

jobs:
  naming: 
    runs-on: ubuntu-20.04
    steps:
    - id: naming
      run: |
        [ "$GITHUB_REF" == "refs/heads/master" ] && export PRERELEASE=false || export PRERELEASE=true
        [ "$GITHUB_REF" == "refs/heads/master" ] && export NAME="Release ${{ github.run_number }}" || export NAME="${GITHUB_REF#refs/heads/} release ${{ github.run_number }}"
        [ "$GITHUB_REF" == "refs/heads/master" ] && export TAG_NAME="release.${{ github.run_number }}" || export TAG_NAME="${GITHUB_REF#refs/heads/}.release.${{ github.run_number }}"
        echo "::set-output name=prerelease::${PRERELEASE}"
        echo "::set-output name=name::${NAME}"
        echo "::set-output name=tag_name::${TAG_NAME}"
    outputs:
      prerelease: ${{ steps.naming.outputs.prerelease }}
      name: ${{ steps.naming.outputs.name }}
      tag_name: ${{ steps.naming.outputs.tag_name }}
  build:
    needs: naming
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@master
    - name: Getting Go Binaries
      uses: actions/setup-go@v2
      with:
          go-version: '1.21'
    
    - name: Build App
      run: |
          go get -u && go mod tidy
          CGO_ENABLED=1 go build -o codegen main.go

    - name: Build .deb & .rpm Packages
      run: |
        sudo apt install rpm -y
        TMP_DIR=/tmp/codegen-build
        DEBIAN_PATH=$TMP_DIR/DEBIAN
        SERVER_BIN_PATH=/usr/bin
        TEMPLATES_PATH=/etc/codegen/templates
        CONFIG_PATH=/etc/codegen/config

        rm -rf $TMP_DIR

        sudo mkdir -p $TMP_DIR
        sudo mkdir -p $DEBIAN_PATH
        sudo mkdir -p $SERVER_BIN_PATH
        sudo mkdir -p $TEMPLATES_PATH
        sudo mkdir -p $CONFIG_PATH
         
        sudo cp ./scripts/debian/control $DEBIAN_PATH/control
        sudo cp ./scripts/debian/postinst $DEBIAN_PATH/postinst
        sudo cp codegen $SERVER_BIN_PATH/codegen
        sudo cp .env.example $SERVER_BIN_PATH/.env.example
        sudo cp -r templates/* $TEMPLATES_PATH/
        sudo cp -r config/* $CONFIG_PATH/
         
        sudo sed -i s/%VERSION%/${{ github.run_number }}/g $DEBIAN_PATH/control
        sudo chmod 775 $DEBIAN_PATH/postinst
 
        sudo dpkg-deb --build $TMP_DIR
        sudo mv /tmp/codegen-build.deb /tmp/codegen-${{ github.run_number }}-x64.deb
 
        sudo rm -rf $DEBIAN_PATH
 
        sudo sed -i s/%VERSION%/${{ github.run_number }}/g scripts/redhat/app.spec
        sudo rpmbuild -ba scripts/redhat/app.spec --define "_app_dir $TMP_DIR" --define "_rpmdir /tmp" --define "_rpmfilename codegen-${{ github.run_number }}-x64.rpm"
    
    - name: Release
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
      with:
          files: |
            /tmp/codegen-${{ github.run_number }}-x64.deb
            /tmp/codegen-${{ github.run_number }}-x64.rpm
          name: "${{ needs.naming.outputs.name }}"
          tag_name: "${{ needs.naming.outputs.tag_name }}"
          prerelease: ${{ needs.naming.outputs.prerelease }}
